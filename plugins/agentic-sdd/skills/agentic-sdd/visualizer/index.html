<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic SDD Kanban</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --card: #243044;
    --border: #2d3a4d;
    --text: #e7ecf3;
    --muted: #8b9cb3;
    --accent: #5b9cff;
    --feature: #5b9cff;
    --bug: #ff6b6b;
    --done: #51cf66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .overall { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button, .controls select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls button:hover { background: #2d3a4d; }
  .board {
    display: flex;
    gap: 12px;
    padding: 16px;
    overflow-x: auto;
    min-height: calc(100vh - 80px);
  }
  .column {
    background: var(--surface);
    border-radius: 10px;
    min-width: 280px;
    max-width: 320px;
    padding: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .column-header h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .count {
    background: var(--card);
    color: var(--muted);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .cards { flex: 1; min-height: 100px; }
  .card {
    background: var(--card);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .card .type.feature { color: var(--feature); }
  .card .type.bug { color: var(--bug); }
  .card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card .goal { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 6px; }
  .card .meta { font-size: 11px; color: #6b7c93; }
  .empty { color: var(--muted); font-size: 12px; padding: 16px 8px; text-align: center; }
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .detail-overlay.open { display: flex; }
  .detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 480px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
  }
  .detail h3 { margin: 0 0 8px; }
  .detail .close { float: right; cursor: pointer; color: var(--muted); }
  .detail pre { background: var(--bg); padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Agentic SDD Kanban</h1>
    <div class="overall" id="overall">Loading...</div>
  </div>
  <div class="controls">
    <select id="filter">
      <option value="all">All</option>
      <option value="feature">Features</option>
      <option value="bug">Bugs</option>
    </select>
    <button onclick="load()">Refresh</button>
  </div>
</header>
<div class="board" id="board"></div>

<div class="detail-overlay" id="overlay" onclick="closeDetail()">
  <div class="detail" onclick="event.stopPropagation()">
    <span class="close" onclick="closeDetail()">✕</span>
    <div id="detail-content"></div>
  </div>
</div>

<script>
const columns = [
  { id: "specified", title: "Specified" },
  { id: "in_progress", title: "In Progress" },
  { id: "done", title: "Done" },
  { id: "assessed", title: "Bug: Assessed" },
  { id: "fixed", title: "Bug: Fixed" },
  { id: "verified", title: "Bug: Verified" },
  { id: "failed", title: "Bug: Failed" }
];

let allItems = [];

async function load() {
  try {
    const res = await fetch("/api/board");
    const data = await res.json();
    allItems = data.items || [];
    document.getElementById("overall").textContent = data.overall || "No overall status";
    render();
  } catch (e) {
    document.getElementById("overall").textContent = "Failed to load board";
  }
}

function render() {
  const filter = document.getElementById("filter").value;
  const items = filter === "all" ? allItems : allItems.filter(i => i.type === filter);
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (const col of columns) {
    const colItems = items.filter(i => i.status === col.id);
    const div = document.createElement("div");
    div.className = "column";
    div.innerHTML = `
      <div class="column-header">
        <h2>${col.title}</h2>
        <span class="count">${colItems.length}</span>
      </div>
      <div class="cards"></div>
    `;
    const cards = div.querySelector(".cards");
    if (colItems.length === 0) {
      cards.innerHTML = `<div class="empty">—</div>`;
    } else {
      for (const item of colItems) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="type ${item.type}">${item.type.toUpperCase()}</div>
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="goal">${escapeHtml(item.goal || "")}</div>
          <div class="meta">${escapeHtml(item.path)}</div>
        `;
        card.onclick = () => showDetail(item);
        cards.appendChild(card);
      }
    }
    board.appendChild(div);
  }
}

function showDetail(item) {
  const content = document.getElementById("detail-content");
  content.innerHTML = `
    <div class="type ${item.type}" style="margin-bottom:8px">${item.type.toUpperCase()}</div>
    <h3>${escapeHtml(item.title)}</h3>
    <p style="color:var(--muted);font-size:14px">${escapeHtml(item.goal || "")}</p>
    <p style="font-size:12px;color:#6b7c93">Path: ${escapeHtml(item.path)}</p>
    ${item.acs && item.acs.length ? `<h4 style="font-size:13px;margin:16px 0 8px">Acceptance Criteria</h4><pre>${item.acs.map(a => escapeHtml(a)).join("\n")}</pre>` : ""}
  `;
  document.getElementById("overlay").classList.add("open");
}

function closeDetail() {
  document.getElementById("overlay").classList.remove("open");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

document.getElementById("filter").onchange = render;
load();
setInterval(load, 8000);
</script>
</body>
</html>
