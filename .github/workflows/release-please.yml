name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write   # npm provenance for the publish job
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # A release created with GITHUB_TOKEN does not fire `release: published`
  # workflows, so publishing runs here, right after the release exists.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: npm CLI that supports trusted publishing (OIDC needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      # Trusted publishing: configured on npmjs.com for this repository and
      # workflow file; no secret needed. Used whenever NPM_TOKEN is absent.
      - name: Publish with provenance (trusted publishing)
        if: env.NPM_TOKEN_SET == ''
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN }}
      - name: Publish with provenance (token)
        if: env.NPM_TOKEN_SET != ''
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
