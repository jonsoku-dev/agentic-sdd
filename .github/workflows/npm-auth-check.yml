name: npm-auth-check
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"   # weekly, so an expired or revoked token is noticed before a release needs it
permissions:
  contents: read
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Token is valid and can see the package (skipped once trusted publishing replaces the token)
        if: env.NPM_TOKEN_SET != ''
        run: |
          npm whoami
          npm access list packages 2>/dev/null | grep -q '^agentic-sdd' || npm view agentic-sdd version
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
