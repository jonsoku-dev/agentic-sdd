name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: bash -n install.sh && for f in hosts/cursor/hooks/agentic-sdd-continue/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: llms.txt is current
        run: python3 scripts/build_llms.py --check
