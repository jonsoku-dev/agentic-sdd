name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # npm provenance (Sigstore attestation of the GitHub build)
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package contents
        run: npm pack --dry-run
      - name: npm CLI that supports trusted publishing (OIDC needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - name: Publish with provenance (trusted publishing)
        if: env.NPM_TOKEN_SET == ''
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN }}
      - name: Publish with provenance (token)
        if: env.NPM_TOKEN_SET != ''
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
